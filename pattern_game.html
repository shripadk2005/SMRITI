{% extends "base.html" %}

{% block title %}Pattern Recognition – SMRITI{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
    <div>
      <a href="{{ url_for('games.games_hub_page') }}" class="btn btn-outline-secondary btn-sm mb-2">
        <i class="fa-solid fa-arrow-left me-1"></i> All Games
      </a>
      <h1 class="display-6 fw-bold mb-1">🧩 Pattern & Shape Recognition</h1>
      <p class="fs-5 text-muted mb-0">Discover the sequence pattern and choose what comes next.</p>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-elderly btn-light border btn-read-aloud" data-read-target=".container p">
        <i class="fa-solid fa-volume-high text-primary me-2"></i> Read
      </button>
      <button class="btn btn-elderly btn-outline-success" onclick="if(window.currentGame) window.currentGame.init();">
        <i class="fa-solid fa-rotate-right me-2"></i> Restart
      </button>
    </div>
  </div>

  <div id="pattern-game-container" class="card card-mindcare p-4 mb-4 shadow-sm">
    <!-- Populated by PatternGame in games.js -->
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function startPatternGame() {
  if (typeof PatternGame !== 'undefined') {
    window.currentGame = new PatternGame('pattern-game-container', '{{ initial_difficulty or "MEDIUM" }}');
  } else {
    setTimeout(startPatternGame, 50);
  }
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', startPatternGame);
} else {
  startPatternGame();
}
</script>
{% endblock %}
