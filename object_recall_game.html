{% extends "base.html" %}

{% block title %}Remember the Objects – SMRITI{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
    <div>
      <a href="{{ url_for('games.games_hub_page') }}" class="btn btn-outline-secondary btn-sm mb-2">
        <i class="fa-solid fa-arrow-left me-1"></i> All Games
      </a>
      <h1 class="display-6 fw-bold mb-1">👀 Remember the Objects</h1>
      <p class="fs-5 text-muted mb-0" id="recall-phase-header">Look carefully and remember these 5 familiar items.</p>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-elderly btn-light border btn-read-aloud" data-read-target="#recall-phase-header">
        <i class="fa-solid fa-volume-high text-primary me-2"></i> Read
      </button>
      <button class="btn btn-elderly btn-outline-success" onclick="if(window.currentGame) window.currentGame.init();">
        <i class="fa-solid fa-rotate-right me-2"></i> Restart
      </button>
    </div>
  </div>

  <!-- Memorize Phase Area -->
  <div id="recall-display-area" class="card card-mindcare p-4 mb-4 shadow-sm">
    <!-- Populated by ObjectRecallGame in games.js -->
  </div>

  <!-- Recall Choice Selection Area -->
  <div id="recall-choice-area" class="card card-mindcare p-4 mb-4 shadow-sm" style="display: none;">
    <!-- Populated by ObjectRecallGame in games.js -->
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function startRecallGame() {
  if (typeof ObjectRecallGame !== 'undefined') {
    window.currentGame = new ObjectRecallGame('recall-display-area', 'recall-choice-area', '{{ initial_difficulty or "EASY" }}');
  } else {
    setTimeout(startRecallGame, 50);
  }
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', startRecallGame);
} else {
  startRecallGame();
}
</script>
{% endblock %}
